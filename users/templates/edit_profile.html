{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Profile Context</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body class="bg-light text-dark">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h2 class="h5 m-0 fw-bold">Editing: {{ target_user.username }}</h2>
                        <a href="{% url 'dashboard_router' %}" class="btn btn-sm btn-outline-secondary">← Back</a>
                    </div>
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            {% for field in form %}
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-muted">{{ field.label }}</label>
                                    {{ field }}
                                    {% if field.errors %}
                                        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                                    {% endif %}
                                </div>
                            {% endfor %}
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="{% url 'dashboard_router' %}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Save System Profile Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
