{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

     <!-- FORCE INPUT WIDENING -->
    <style>
        form input[type="text"],  
        form input[type="password"] {
            width: 750px !important;  /* Change this number to make them as long as you want */
            max-width: 100% !important;
            display: block !important;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }
    </style>

</head>
<body class="bg-light d-flex align-items-center vh-100">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 fw-bold">Sign In</h2>
                        
                        {% if form.errors %}
                            <div class="alert alert-danger py-2 text-center text-sm">
                                Invalid username or password configuration.
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            {% for field in form %}
                                <div class="mb-3 text-start">
                                    <label class="form-label small fw-bold text-dark d-block mb-1">{{ field.label }}</label>
                                    {{ field }}
                                    {% if field.errors %}
                                        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                                    {% endif %}
                                </div>
                            {% endfor %}
                            <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-semibold">Log In</button>
                        </form>

                        <div class="text-center mt-4">
                            <span class="small text-muted">Need an account?</span> 
                            <a href="{% url 'register' %}" class="small text-decoration-none">Sign up here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
